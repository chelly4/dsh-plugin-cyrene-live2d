<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="8" y1="2" x2="56" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8FC"/>
      <stop offset="0.62" stop-color="#FDE4F1"/>
      <stop offset="1" stop-color="#F8CCE2"/>
    </linearGradient>
    <linearGradient id="hair" x1="14" y1="8" x2="50" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC4DC"/>
      <stop offset="0.55" stop-color="#FB9FC6"/>
      <stop offset="1" stop-color="#F08CC0"/>
    </linearGradient>
    <linearGradient id="hairTip" x1="20" y1="34" x2="46" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7A8CE"/>
      <stop offset="1" stop-color="#C9A2E8"/>
    </linearGradient>
    <linearGradient id="feather" x1="10" y1="10" x2="22" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD3E6"/>
      <stop offset="0.6" stop-color="#FFAFD2"/>
      <stop offset="1" stop-color="#8FD0F4"/>
    </linearGradient>
    <linearGradient id="rose" x1="9" y1="22" x2="18" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A9D4F5"/>
      <stop offset="1" stop-color="#5A8FCE"/>
    </linearGradient>
    <linearGradient id="dress" x1="20" y1="48" x2="46" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EFE4FA"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#F3B9D3" stroke-width="1.2" opacity=".75"/>

  <!-- 月桂光环（背后，很淡）-->
  <path d="M11 34c-2.4-6-1.2-13 3.4-17.6" stroke="#F7DCE9" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M53 34c2.4-6 1.2-13-3.4-17.6" stroke="#F7DCE9" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M13.6 26c-2.6.4-4.4 2-5.2 4.4 2.4.6 4.4-.2 5.6-2" fill="#FBE7F1"/>
  <path d="M50.4 26c2.6.4 4.4 2 5.2 4.4-2.4.6-4.4-.2-5.6-2" fill="#FBE7F1"/>
  <path d="M16.4 18.4c-2.2-1-4.4-.6-6 1.2 1.8 1.4 4 1.6 5.8.4" fill="#FDEFF6"/>
  <path d="M47.6 18.4c2.2-1 4.4-.6 6 1.2-1.8 1.4-4 1.6-5.8.4" fill="#FDEFF6"/>

  <!-- 长发（后层） -->
  <path d="M32 6c10.4 0 17.6 6.8 18.6 16.2 1 9.8-1.6 18.4-5.2 24.4-2.2 3.6-6 6.4-10 7.4 2.2-4.6 2-9.2.6-13.2-1.8 5-5 8.4-9.6 10.4 1.4-4.2.8-8-1.6-11.4 1.6 3.6.4 7-3 9.8-3-3-4.2-6.8-2.4-11-2.4 3.6-2.8 7.4-1.2 11.4-4-1.6-7-4.6-9.2-9-3.4 3.4-3.6 7.6-1.4 12-4-1.2-7.4-4.4-9.4-8.6C8.6 31 6.6 23 7.6 14.6 9 6.8 21.6 6 32 6Z" fill="url(#hair)"/>
  <!-- 发梢的紫调 -->
  <path d="M14 40c1.4 5 4.4 8.6 8.4 10.6-2.6-3.4-3.2-7.2-2.2-10.8z" fill="url(#hairTip)" opacity=".85"/>
  <path d="M50 40c-1.4 5-4.4 8.6-8.4 10.6 2.6-3.4 3.2-7.2 2.2-10.8z" fill="url(#hairTip)" opacity=".85"/>

  <!-- 脸 -->
  <ellipse cx="32" cy="33.4" rx="14.6" ry="13.8" fill="#FFF1F0"/>
  <!-- 下巴的暖色阴影 -->
  <path d="M23 42c2.6 3 5.6 4.4 9 4.4s6.4-1.4 9-4.4c-2.4 1.6-5.4 2.4-9 2.4s-6.6-.8-9-2.4Z" fill="#FFE0E2" opacity=".7"/>

  <!-- 刘海：整片盖住额头，边缘是尖 -->
