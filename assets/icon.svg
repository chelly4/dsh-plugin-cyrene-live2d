  <path d="M23.4 22.4c1.8-1.6 3.8-2.4 6-2.6" stroke="#FFDCEB" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>

  <!-- 闭眼笑 + 腮红 + 嘴 -->
  <path d="M21.6 33.6c1.8-2 4-2 5.8 0" stroke="#D95F80" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M36.6 33.6c1.8-2 4-2 5.8 0" stroke="#D95F80" stroke-width="2.1" stroke-linecap="round"/>
  <ellipse cx="21.2" cy="38.6" rx="3.4" ry="2.2" fill="#FF9DBB" opacity=".55"/>
  <ellipse cx="42.8" cy="38.6" rx="3.4" ry="2.2" fill="#FF9DBB" opacity=".55"/>
  <path d="M20.2 37.4l-1.6 1.2M23 37.2l-1.6 1.2M43.8 37.4l1.6 1.2M41 37.2l1.6 1.2" stroke="#F08AAF" stroke-width=".9" stroke-linecap="round" opacity=".7"/>
  <path d="M30.4 40.6c.6 2.2 2.6 3.2 4.2 1.2" stroke="#D95F80" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 双手捧脸 -->
  <ellipse cx="18.4" cy="43.4" rx="4.2" ry="5" fill="#FFF1F0" stroke="#F6CCD3" stroke-width=".9" transform="rotate(-12 18.4 43.4)"/>
  <ellipse cx="45.6" cy="43.4" rx="4.2" ry="5" fill="#FFF1F0" stroke="#F6CCD3" stroke-width=".9" transform="rotate(12 45.6 43.4)"/>
  <path d="M15.4 40.4c.8-1 2-1 2.8-.2M18.8 39.4c.8-1 2-1 2.8-.2M45.8 40.4c-.8-1-2-1-2.8-.2M42.4 39.4c-.8-1-2-1-2.8-.2" stroke="#F0C9CE" stroke-width="1" stroke-linecap="round" opacity=".9"/>

  <!-- 发饰：羽 + 蓝玫瑰 -->
  <path d="M10.4 9.6c5.6 1 9.8 4.4 12 10.2-5.8-.4-10.2-4-12-10.2Z" fill="url(#feather)"/>
  <path d="M10.4 9.6c4.4 3.6 7.6 7.2 9.8 10.6" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity=".85"/>
  <path d="M13.6 14.8c2 .8 3.6 2 4.8 3.6" stroke="#FFE7F2" stroke-width=".9" stroke-linecap="round" opacity=".8"/>
  <circle cx="12.6" cy="25.6" r="5.2" fill="url(#rose)"/>
  <path d="M12.6 21.6c2.2 1 3.4 2.6 3.4 4.4 0 1.6-1.2 2.8-3.4 3.4-2.2-.6-3.4-1.8-3.4-3.4 0-1.8 1.2-3.4 3.4-4.4Z" fill="#BFE0F8" opacity=".85"/>
  <circle cx="12.4" cy="25.4" r="1.5" fill="#FFFFFF" opacity=".9"/>

  <!-- 衣服：白紫祭司裙 + 玫瑰胸针 -->
  <path d="M17.4 57.4c2.4-5.4 8-8.4 14.6-8.4s12.2 3 14.6 8.4c.5 1.1-.2 2.3-1.4 2.3H18.8c-1.2 0-1.9-1.2-1.4-2.3Z" fill="url(#dress)"/>
  <path d="M32 49.4l-5.2-2.6c-1.2-.6-2.2.6-1.5 1.7l4.3 5.5 2.4-4.6 2.4 4.6 4.3-5.5c.7-1.1-.3-2.3-1.5-1.7z" fill="#EDE2FA"/>
  <path d="M27.6 57.2c1.6-2.8 3-4.4 4.4-5.4" stroke="#C9A2E8" stroke-width="1.1" stroke-linecap="round" opacity=".6"/>
  <circle cx="32" cy="53.2" r="2.6" fill="url(#rose)"/>
  <circle cx="31.6" cy="52.6" r=".9" fill="#FFFFFF" opacity=".9"/>

  <!-- 星点 -->
  <path d="M54.4 47.6l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" fill="#FFFFFF" opacity=".95"/>
  <path d="M10 46.4l.5 1.3 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5z" fill="#FFFFFF" opacity=".9"/>
</svg>
